[project]
name = "graph-hw"
version = "0.1.0"
description = "Local GraphRAG notebook for metallurgy documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "graphrag==3.1.0",
    "litellm==1.86.2",
    "jupyterlab",
    "ipykernel",
    "pyyaml",
    "pandas",
    "pyarrow",
    "pyvis==0.3.2",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "razdel>=0.5.0",
    "pint>=0.26.1",
    "beautifulsoup4>=4.15.0",
]

[tool.uv]
package = false
